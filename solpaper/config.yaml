# solpaper: paper-trading research system for new Solana pairs.
# SIMULATOR ONLY. No keys, no wallets, no signing, no real orders.

db_path: solpaper.db          # relative to this file unless absolute

# ---------------------------------------------------------------- providers
# Limits below were verified on 2026-11-07:
#   DexScreener (docs.dexscreener.com/api/reference): 60 req/min for
#     token-profiles / token-boosts; 300 req/min for pairs, search,
#     tokens/v1 and token-pairs (up to 30 addresses per call).
#   GeckoTerminal keyless (docs.coingecko.com/docs/errors-and-rate-limits):
#     "IP-based rate limiting, shared across all users on the same IP". No
#     fixed number is published. A free Demo key gives 100 calls/min.
#   Solana public RPC: the docs page is behind a bot check; the RPC's own
#     response headers report x-ratelimit-method-limit 150,
#     x-ratelimit-rps-limit 250, x-ratelimit-conn-limit 40.
# `safety` is the share of the published limit we allow ourselves; requests
# are spaced evenly so the scheduler slows down well before any cap.
providers:
  dexscreener:
    base_url: https://api.dexscreener.com
    timeout_s: 15
    buckets:
      slow: {rpm: 60, safety: 0.5}      # token-profiles, token-boosts
      fast: {rpm: 300, safety: 0.5}     # pairs, tokens, token-pairs, search
      study: {rpm: 30, safety: 1.0}     # launch study's outcome checkpoints (same 300/min limit)
  geckoterminal:
    base_url: https://api.geckoterminal.com/api/v2
    timeout_s: 20
    buckets:
      keyless: {rpm: 10, safety: 1.0}   # no published number: stay very low
      trades: {rpm: 4, safety: 1.0}     # trade records (phase 3), on top of the 10 above
  solana_rpc:
    base_url: https://api.mainnet-beta.solana.com
    timeout_s: 20
    buckets:
      rpc: {rpm: 120, safety: 0.5}      # mint/freeze/extension reads, 100 mints per call
      study: {rpm: 60, safety: 0.5}     # launch study's own share (curve reads)
  jupiter:
    # lite-api.jup.ag is keyless; its response headers report 5 requests per
    # ~10 s window, counted per IP (checked 2026-11-07).
    base_url: https://lite-api.jup.ag
    timeout_s: 20
    buckets:
      quote: {rpm: 30, safety: 0.4}     # 12/min

backoff:
  base_s: 2
  max_s: 300
  jitter: 0.2           # +/- 20%

# Never ask for the same thing twice inside its freshness window.
freshness_s:
  gt_new_pools: 60
  gt_trending: 300
  gt_pools_multi: 60
  ds_boosts: 120
  ds_profiles: 120
  ds_pairs: 25           # < refresh interval, so each refresh gets new data
  gt_trades: 600

# ---------------------------------------------------------------- scanner
scanner:
  tick_s: 5
  intervals_s:            # how often each job runs
    gt_new_pools: 60
    gt_trending: 300
    ds_boosts: 120
    ds_profiles: 120
    refresh_tracked: 30
    filter: 30
    trade: 10                   # paper executor (phase 4)
  gt_new_pool_pages: 1    # 20 pools per page
  track_hours: 12         # keep re-observing a pair this long after first seen
  max_tracked: 1000       # 1000 pairs / 30 per call = 34 DexScreener calls per refresh
  volume_spike:           # m5 volume vs the h1 per-5-minute average
    multiple: 3.0
    min_m5_usd: 1000

# ---------------------------------------------------------------- filters (phase 2)
filters:
  liquidity_floor_usd: 10000
  min_age_min: 2
  max_age_hours: 6
  max_reading_age_s: 120        # newest genuinely new reading must be this fresh
  allowed_quotes:               # quote token must be one of these
    So11111111111111111111111111111111111111112: SOL
    EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v: USDC
  risky_extensions: [transferHook, permanentDelegate, nonTransferable, pausableConfig,
                     defaultAccountState, transferFeeConfig]
  token_check_ttl_s: 600        # re-check authorities that weren't revoked
  sell_check_usd: 10            # quote selling this much (default position size)
  sell_quote_slippage_bps: 100  # slippage tolerance sent with the quote request
  max_sell_impact: 0.03         # 3%, judged on measured payout (amendment A3)
  sell_reference_usd: 0.5       # tiny reference sale for the measured impact
  impact_disagreement_tol: 0.05 # flag when Jupiter's figure is >5 points off ours
  sell_quote_ttl_s: 180         # a quote older than this is due for a refresh
  sell_quote_max_age_s: 600     # decide on a quote up to this old while it waits its turn
  sell_checks_per_pass: 1       # Jupiter allows ~6 checks/min; keeps each pass to ~5 s

# Providers label the same venue differently; every rule, stat and export
# uses the label on the right.
dex_aliases:
  pumpfun: pump-fun

# ---------------------------------------------------------------- launch outcome study
# Runs as its own process: python -m solpaper.study run
study:
  sample_rate: 0.10             # share of launches sampled for wallet-level data
  windows_min: [5, 15, 60]      # early-feature windows after first-seen
  lead_s: 20                    # capture this long before a window's cutoff
  max_launch_age_min: 30        # older than this at first-seen = not a launch
  curve_price_tol: 0.05         # curve price vs scanner price, for curve_consistent
  tick_s: 5
  pump_program: 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P
  checkpoints_min: {1h: 60, 6h: 360, 24h: 1440, 72h: 4320, 7d: 10080}
  outcome_retry_min: 30         # a failed checkpoint lookup is retried this long, then `unknown`
  labels:                       # thresholds for outcome labels
    dead_liquidity_usd: 1000    # dead = liquidity below this AND 24h volume below dead_volume
    dead_volume_h24_usd: 500
    dead_price_ratio: 0.1       # no liquidity figure (curve): dead = price <= 10% of first AND low volume
    survived_liquidity_usd: 10000
    survived_volume_h24_usd: 10000   # no liquidity figure: survived = this volume AND price >= ratio
    survived_price_ratio: 0.5
  sources:                      # normalized DEX label -> cohort source (default: pool)
    pump-fun: pumpfun_curve
    raydium-launchlab: other_curve
    meteora-dbc: other_curve
    bags-fm: other_curve

# ---------------------------------------------------------------- wash-trade filter (phase 3)
wash:
  min_trades: 20                # fewer trades = insufficient_trades (never a pass)
  round_trip_s: 600             # same wallet buys and sells within this = a round trip
  tpw_scale: 10                 # trades per wallet at which that component maxes out
  top3_floor: 0.3               # top-3 wallet volume share below this scores 0
  cv_scale: 1.0                 # size/timing coefficient of variation at which regularity scores 0
  weights: {trades_per_wallet: 1, round_trip: 1, concentration: 1, size_regularity: 1,
            timing_regularity: 1}
  threshold: 0.6                # initial value; the research report shows what it filters
  checks_per_pass: 1            # GeckoTerminal's keyless budget allows ~4 trade fetches/min
  ttl_s: 600                    # refresh a wash check after this
  max_age_s: 1800               # decide on a check up to this old while waiting for a refresh

# ---------------------------------------------------------------- fill model (phases 3-4)
fills:
  delay_s: 5                    # signal-to-fill delay
  fee_rate: 0.0025              # DEX fee per leg (PumpSwap/Raydium pools ~0.25%)
  tip_usd: 0.05                 # flat priority fee/tip per transaction
  honeypot_rate: 0.02           # share of entries that can't be sold
  honeypot_seed: 7
  max_fill_wait_s: 90           # no observation within this after the fill time = a gap

# ---------------------------------------------------------------- research phase (phase 3)
research:
  sample_size: 40
  max_launch_age_min: 30        # first seen within this of creation = a launch
  min_pairs: 20                 # fewer pairs in a group = insufficient data / likely noise
  size_usd: 10
  liquidity_collapse: 0.5       # exit if liquidity falls 50% below entry
  rules:                        # every combination is one rule variation
    take_profit: [0.2, 0.5, 1.0]
    stop_loss: [0.1, 0.25]
    time_stop_min: [15, 60]

# ---------------------------------------------------------------- mock wallet + paper executor (phase 4)
wallet:
  start_balance: 100
  min_trade_size: 5             # equity below this cooks the run
  max_drawdown: 0.25            # kill switch: drawdown from peak equity
  vault_target_multiple: 2      # cup rule: above 2x start, bank the excess in the vault
  position_fraction: 0.10       # position size = this share of current equity
  fee_rate: 0.0025              # DEX fee per leg (same as fills.fee_rate)
  slippage_rate: 0              # impact is already in the executor's constant-product fill price
  tip: 0.05                     # flat tip per transaction (same as fills.tip_usd)

trading:
  max_open_positions: 5
  daily_loss_cap_usd: 25        # no new entries after this much realized loss in a UTC day
  one_trade_per_pair: true
  exit:                         # exits: take-profit, stop-loss, time stop, liquidity collapse
    take_profit: 0.5
    stop_loss: 0.25
    time_stop_min: 60
    liquidity_collapse: 0.5
